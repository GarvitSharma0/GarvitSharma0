<svg width="100%" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Garvit Sharma - Data Analytics and Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.5" stop-color="#0a0e27"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a855f7;#39ff14;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#39ff14;#22d3ee;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#22d3ee;#a855f7;#39ff14" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#16204a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="880" height="240" rx="14" fill="url(#bg)"/>
  <rect width="880" height="240" rx="14" fill="url(#grid)" opacity="0.45"/>

  <!-- HUD corner brackets -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 46 V24 H42"/>
    <path d="M860 46 V24 H838"/>
    <path d="M20 194 V216 H42"/>
    <path d="M860 194 V216 H838"/>
  </g>

  <!-- top status strip -->
  <circle cx="34" cy="60" r="4" fill="#39ff14">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="64" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#4b5b8a">SYSTEM ONLINE</text>
  <text x="840" y="64" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#4b5b8a">v4.0 // IN</text>

  <!-- name -->
  <text x="440" y="128" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="54" font-weight="700" letter-spacing="5" fill="url(#neon)" filter="url(#glow)">GARVIT SHARMA</text>

  <!-- animated underline -->
  <line x1="255" y1="148" x2="625" y2="148" stroke="url(#neon)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
  </line>

  <!-- subtitle -->
  <text x="440" y="182" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="17" letter-spacing="3" fill="#7dd3fc">DATA ANALYTICS AND ENGINEER &#183; REAL ESTATE &#215; AI</text>

  <!-- prompt line -->
  <text x="440" y="210" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" letter-spacing="2" fill="#39ff14">&gt; building auditable systems<tspan>_<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- scanline -->
  <rect x="0" y="0" width="880" height="2" fill="#22d3ee" opacity="0.10">
    <animate attributeName="y" values="0;240;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
