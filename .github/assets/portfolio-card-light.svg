<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Portfolio - garvitsharma0.github.io">
  <title>Garvit Sharma - Portfolio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F8FB"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" spreadMethod="pad"
                    gradientTransform="translate(-1 0)">
      <stop offset="0%" stop-color="#0B1B24"/>
      <stop offset="42%" stop-color="#0B1B24"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="58%" stop-color="#0B1B24"/>
      <stop offset="100%" stop-color="#0B1B24"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#0891B2" opacity="0.12"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#0891B2" flood-opacity="0.30"/>
    </filter>

    <clipPath id="card">
      <rect x="1.5" y="1.5" width="837" height="207" rx="20"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1.5" y="1.5" width="837" height="207" rx="20" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect x="1.5" y="1.5" width="837" height="207" fill="url(#grid)"/>
    <rect x="1.5" y="1.5" width="837" height="65" fill="#F7FBFD"/>
  </g>
  <rect x="1.5" y="1.5" width="837" height="207" rx="20" fill="none" stroke="#D5E3EA" stroke-width="1.5"/>
  <line x1="1.5" y1="66.5" x2="838.5" y2="66.5" stroke="#D5E3EA" stroke-width="1.5"/>

  <!-- light travelling around the border -->
  <path d="M 21.5,1.5 H 818.5 A 20,20 0 0 1 838.5,21.5 V 188.5 A 20,20 0 0 1 818.5,208.5 H 21.5 A 20,20 0 0 1 1.5,188.5 V 21.5 A 20,20 0 0 1 21.5,1.5 Z" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-linecap="round"
        filter="url(#glow)" stroke-dasharray="170 856.83">
    <animate attributeName="stroke-dashoffset" values="0;-1026.83" dur="4.2s" repeatCount="indefinite"/>
  </path>

  <!-- window dots -->
  <circle cx="34" cy="33.5" r="5.5" fill="#FF5F57"/>
  <circle cx="54" cy="33.5" r="5.5" fill="#FEBC2E"/>
  <circle cx="74" cy="33.5" r="5.5" fill="#28C840"/>

  <!-- address bar -->
  <rect x="108" y="18.5" width="470" height="30" rx="15" fill="#FFFFFF" stroke="#DCE8EE" stroke-width="1.2"/>
  <g stroke="#0891B2" stroke-width="1.5" fill="none" stroke-linecap="round">
    <rect x="126.5" y="32.5" width="10" height="8" rx="2" fill="#0891B2" stroke="none"/>
    <path d="M 128.5,32.5 v -2.5 a 3,3 0 0 1 6,0 v 2.5"/>
  </g>
  <text x="146" y="38.5" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13.5">
    <tspan fill="#5A7484">https://</tspan><tspan fill="#0B1B24" font-weight="600">garvitsharma0.github.io</tspan>
  </text>

  <!-- live chip -->
  <rect x="700" y="18.5" width="106" height="30" rx="15" fill="#0891B2" fill-opacity="0.10"
        stroke="#0891B2" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="722" cy="33.5" r="4" fill="#0891B2" opacity="0.6">
    <animate attributeName="r" values="4;12" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="722" cy="33.5" r="4" fill="#0891B2"/>
  <text x="738" y="38" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700"
        letter-spacing="2.4" fill="#0891B2">LIVE</text>

  <!-- headline -->
  <text x="34" y="124" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="40" font-weight="800"
        letter-spacing="-0.5" fill="url(#shine)">Garvit Sharma</text>

  <!-- caret + rotating role -->
  <text x="34" y="158" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0891B2">&#9656;
    <animate attributeName="opacity" values="1;1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
    <text x="54" y="158" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0891B2" opacity="0">Data Analytics &amp; Science<animate attributeName="opacity" dur="8.1s" repeatCount="indefinite" begin="-0.00s" values="0;1;1;0;0" keyTimes="0;0.05;0.29;0.34;1" /></text>
    <text x="54" y="158" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0891B2" opacity="0">AI Automation Engineer<animate attributeName="opacity" dur="8.1s" repeatCount="indefinite" begin="-2.70s" values="0;1;1;0;0" keyTimes="0;0.05;0.29;0.34;1" /></text>
    <text x="54" y="158" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0891B2" opacity="0">Data Engineering<animate attributeName="opacity" dur="8.1s" repeatCount="indefinite" begin="-5.40s" values="0;1;1;0;0" keyTimes="0;0.05;0.29;0.34;1" /></text>

  <!-- tagline -->
  <text x="34" y="187" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#5A7484">Analytics · ML · Pipelines · AI agents — turning manual workflows into auditable systems.</text>

  <!-- open button -->
  <circle cx="762" cy="140" r="34" fill="#0891B2" fill-opacity="0.08"
          stroke="#0891B2" stroke-opacity="0.30" stroke-width="1.5"/>
  <circle cx="762" cy="140" r="34" fill="none" stroke="#0891B2" stroke-opacity="0.5" stroke-width="1.5">
    <animate attributeName="r" values="34;46" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#0891B2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 748,140 H 774 M 765,131 l 9,9 -9,9"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 7 0; 0 0" dur="1.9s" repeatCount="indefinite"
                      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>
</svg>
